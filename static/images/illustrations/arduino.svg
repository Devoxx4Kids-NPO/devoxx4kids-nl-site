<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="Arduino met een lampje en een knop">
  <!-- Cartoon Arduino board wired to a breadboard with a glowing LED and a push button, for the Arduino module. -->
  <ellipse cx="120" cy="166" rx="104" ry="9" fill="#040707" opacity="0.15"/>
  <!-- board -->
  <rect x="24" y="40" width="120" height="100" rx="8" fill="#3a3f44" stroke="#040707" stroke-width="4"/>
  <path d="M34 52 Q36 48 44 48" fill="none" stroke="#6f7479" stroke-width="4" stroke-linecap="round"/>
  <rect x="12" y="62" width="26" height="24" rx="3" fill="#a5a7aa" stroke="#040707" stroke-width="4"/>
  <rect x="12" y="102" width="22" height="20" rx="3" fill="#040707"/>
  <rect x="50" y="46" width="86" height="10" rx="2" fill="#040707"/>
  <path d="M56 51 H132" stroke="#a5a7aa" stroke-width="3" stroke-dasharray="3 5"/>
  <rect x="62" y="88" width="58" height="22" rx="2" fill="#040707"/>
  <path d="M66 86 V82 M76 86 V82 M86 86 V82 M96 86 V82 M106 86 V82 M116 86 V82 M66 112 V116 M76 112 V116 M86 112 V116 M96 112 V116 M106 112 V116 M116 112 V116" stroke="#a5a7aa" stroke-width="3"/>
  <circle cx="130" cy="70" r="5" fill="#f2a426" stroke="#040707" stroke-width="2.5"/>
  <rect x="50" y="124" width="86" height="10" rx="2" fill="#040707"/>
  <!-- breadboard -->
  <rect x="150" y="80" width="80" height="72" rx="6" fill="#ffffff" stroke="#040707" stroke-width="4"/>
  <path d="M158 132 H222 M158 142 H222" stroke="#a5a7aa" stroke-width="3" stroke-dasharray="2 6"/>
  <!-- wires from the board's pins -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M112 50 C116 16 170 24 174 104" stroke="#f78c40"/>
    <path d="M126 50 C132 28 204 34 206 112" stroke="#e2a02e"/>
  </g>
  <!-- LED with glow -->
  <g stroke="#040707" stroke-width="3" stroke-linecap="round">
    <path d="M176 110 V124 M184 110 V124"/>
  </g>
  <path d="M170 110 V92 Q170 80 180 80 Q190 80 190 92 V110 Z" fill="#f2a426" stroke="#040707" stroke-width="3.5" stroke-linejoin="round"/>
  <g stroke="#e2a02e" stroke-width="4" stroke-linecap="round">
    <path d="M160 74 L154 68"/><path d="M180 68 V60"/><path d="M200 74 L206 68"/>
  </g>
  <!-- push button -->
  <rect x="198" y="106" width="22" height="20" rx="3" fill="#5a5a5a" stroke="#040707" stroke-width="3"/>
  <circle cx="209" cy="116" r="6" fill="#040707"/>
</svg>
