<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="Computerchip">
  <!-- Cartoon processor chip on a circuit board, for the Introductie IT module (how a computer works). -->
  <ellipse cx="120" cy="166" rx="92" ry="9" fill="#040707" opacity="0.15"/>
  <!-- circuit traces -->
  <g fill="none" stroke="#040707" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 70 H30 V40"/><path d="M58 110 H24"/><path d="M182 70 H212"/><path d="M182 110 H204 V140"/>
    <path d="M100 38 V18 H70"/><path d="M140 142 V160"/>
  </g>
  <g fill="#e2a02e" stroke="#040707" stroke-width="3"><circle cx="30" cy="36" r="7"/><circle cx="20" cy="110" r="7"/><circle cx="216" cy="70" r="7"/><circle cx="204" cy="144" r="7"/><circle cx="66" cy="18" r="7"/></g>
  <!-- pins -->
  <g fill="#a5a7aa" stroke="#040707" stroke-width="3">
    <rect x="78" y="30" width="10" height="16" rx="2"/><rect x="98" y="30" width="10" height="16" rx="2"/><rect x="118" y="30" width="10" height="16" rx="2"/><rect x="138" y="30" width="10" height="16" rx="2"/><rect x="152" y="30" width="10" height="16" rx="2"/>
    <rect x="78" y="134" width="10" height="16" rx="2"/><rect x="98" y="134" width="10" height="16" rx="2"/><rect x="118" y="134" width="10" height="16" rx="2"/><rect x="152" y="134" width="10" height="16" rx="2"/>
    <rect x="50" y="62" width="16" height="10" rx="2"/><rect x="50" y="85" width="16" height="10" rx="2"/><rect x="50" y="106" width="16" height="10" rx="2"/>
    <rect x="174" y="62" width="16" height="10" rx="2"/><rect x="174" y="85" width="16" height="10" rx="2"/><rect x="174" y="106" width="16" height="10" rx="2"/>
  </g>
  <!-- chip -->
  <rect x="62" y="42" width="116" height="96" rx="14" fill="#3a3f44" stroke="#040707" stroke-width="4"/>
  <rect x="84" y="62" width="72" height="56" rx="8" fill="#f2a426" stroke="#040707" stroke-width="4"/>
  <path d="M72 52 Q74 48 82 48" fill="none" stroke="#6f7479" stroke-width="4" stroke-linecap="round"/>
  <text x="120" y="98" font-family="Outfit, Nunito, Arial, sans-serif" font-weight="700" font-size="22" fill="#040707" text-anchor="middle">CPU</text>
</svg>
