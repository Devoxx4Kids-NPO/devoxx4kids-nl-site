<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="LEGO-robot die praat">
  <!-- Cartoon brick robot on caterpillar tracks with a speech bubble, for the LEGO Boost module. -->
  <ellipse cx="128" cy="166" rx="92" ry="9" fill="#040707" opacity="0.15"/>
  <!-- speech bubble -->
  <path d="M18 12 H66 Q74 12 74 20 V40 Q74 48 66 48 H54 L70 60 L42 48 H18 Q10 48 10 40 V20 Q10 12 18 12 Z" fill="#ffffff" stroke="#040707" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#040707"><circle cx="28" cy="30" r="4.5"/><circle cx="42" cy="30" r="4.5"/><circle cx="56" cy="30" r="4.5"/></g>
  <!-- tracks -->
  <rect x="48" y="126" width="160" height="34" rx="17" fill="#2b2f33" stroke="#040707" stroke-width="4"/>
  <g fill="#5a5a5a" stroke="#040707" stroke-width="3">
    <circle cx="68" cy="143" r="10"/><circle cx="128" cy="143" r="10"/><circle cx="188" cy="143" r="10"/>
  </g>
  <!-- arms -->
  <g stroke="#040707" stroke-width="3.5" stroke-linejoin="round">
    <rect x="44" y="86" width="32" height="14" rx="7" fill="#f78c40"/>
    <rect x="180" y="86" width="32" height="14" rx="7" fill="#f78c40"/>
  </g>
  <!-- body brick with the move hub -->
  <rect x="70" y="78" width="116" height="50" rx="6" fill="#dedfe0" stroke="#040707" stroke-width="4"/>
  <rect x="104" y="88" width="48" height="30" rx="4" fill="#f2a426" stroke="#040707" stroke-width="3"/>
  <circle cx="128" cy="103" r="7" fill="#ffffff" stroke="#040707" stroke-width="3"/>
  <!-- neck -->
  <rect x="118" y="66" width="20" height="14" fill="#5a5a5a" stroke="#040707" stroke-width="4"/>
  <!-- studs, then the head over them -->
  <g fill="#dedfe0" stroke="#040707" stroke-width="3">
    <rect x="94" y="14" width="14" height="10" rx="2"/><rect x="112" y="14" width="14" height="10" rx="2"/>
    <rect x="130" y="14" width="14" height="10" rx="2"/><rect x="148" y="14" width="14" height="10" rx="2"/>
  </g>
  <rect x="84" y="20" width="88" height="48" rx="10" fill="#dedfe0" stroke="#040707" stroke-width="4"/>
  <path d="M94 28 Q96 24 104 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#040707" stroke-width="4" stroke-linecap="round">
    <path d="M100 31 Q109 26 119 30"/><path d="M137 30 Q147 26 156 31"/>
  </g>
  <circle cx="110" cy="48" r="12" fill="#e2a02e" stroke="#040707" stroke-width="4"/>
  <circle cx="146" cy="48" r="12" fill="#e2a02e" stroke="#040707" stroke-width="4"/>
  <circle cx="112" cy="50" r="5" fill="#040707"/><circle cx="148" cy="50" r="5" fill="#040707"/>
  <circle cx="106" cy="44" r="3" fill="#ffffff"/><circle cx="142" cy="44" r="3" fill="#ffffff"/>
</svg>
