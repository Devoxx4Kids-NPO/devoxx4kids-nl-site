<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="mBot2">
  <!-- Cartoon mBot2 in the Devoxx4Kids palette: steel body, robot-amber sensor eyes, CyberPi on top. -->
  <g fill="none" stroke="#e2a02e" stroke-width="6" stroke-linecap="round">
    <path d="M100 30 Q120 16 140 30"/>
    <path d="M90 20 Q120 -2 150 20"/>
  </g>
  <ellipse cx="120" cy="166" rx="92" ry="9" fill="#040707" opacity="0.15"/>
  <!-- wheels -->
  <rect x="14" y="88" width="36" height="72" rx="14" fill="#2b2f33" stroke="#040707" stroke-width="4"/>
  <rect x="190" y="88" width="36" height="72" rx="14" fill="#2b2f33" stroke="#040707" stroke-width="4"/>
  <g stroke="#8b8d90" stroke-width="3" stroke-linecap="round">
    <path d="M22 104h20M22 118h20M22 132h20M22 146h20"/>
    <path d="M198 104h20M198 118h20M198 132h20M198 146h20"/>
  </g>
  <!-- CyberPi controller -->
  <rect x="72" y="40" width="96" height="42" rx="10" fill="#040707" stroke="#040707" stroke-width="4"/>
  <rect x="84" y="48" width="72" height="26" rx="5" fill="#f2a426"/>
  <g stroke="#040707" stroke-width="3.5" stroke-linecap="round">
    <path d="M92 56h22M92 66h34M120 56h10"/>
  </g>
  <!-- body -->
  <rect x="44" y="78" width="152" height="80" rx="18" fill="#dedfe0" stroke="#040707" stroke-width="4"/>
  <path d="M56 92 Q58 84 68 84" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- ultrasonic sensor eyes -->
  <rect x="64" y="96" width="112" height="44" rx="22" fill="#5a5a5a" stroke="#040707" stroke-width="4"/>
  <circle cx="92" cy="118" r="16" fill="#e2a02e" stroke="#040707" stroke-width="4"/>
  <circle cx="148" cy="118" r="16" fill="#e2a02e" stroke="#040707" stroke-width="4"/>
  <circle cx="94" cy="120" r="6" fill="#040707"/>
  <circle cx="150" cy="120" r="6" fill="#040707"/>
  <circle cx="87" cy="112" r="3.5" fill="#ffffff"/>
  <circle cx="143" cy="112" r="3.5" fill="#ffffff"/>
</svg>
